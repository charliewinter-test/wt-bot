name: .NET release check

on:
  schedule:
    - cron: "0 8 * * *"    # 09:00 BST / 08:00 GMT daily
    - cron: "0 20 * * *"   # 21:00 BST / 20:00 GMT daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dotnet-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new .NET releases
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCH_CHANNELS: ""
          SECURITY_ONLY: "false"
        run: python3 check_dotnet_releases.py

      - name: Commit updated state
        run: |
          if [[ -n "$(git status --porcelain dotnet-release-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dotnet-release-state.json
            git commit -m "chore: update .NET release state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No state change to commit."
          fi
