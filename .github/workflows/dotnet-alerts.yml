name: Monitor .NET Releases

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual testing

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Microsoft CDN and Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Fetch official live .NET release index from Microsoft CDN
          METADATA=$(curl -s "https://microsoft.com")

          # Parse the first active, non-preview major channel (e.g., .NET 10 or .NET 9)
          LATEST_STABLE_BLOCK=$(echo "$METADATA" | jq -c '[."releases-index"[] | select(."support-phase" != "preview")][0]')
          
          # Extract variables safely
          VERSION=$(echo "$LATEST_STABLE_BLOCK" | jq -r '."latest-release"')
          RELEASE_DATE=$(echo "$LATEST_STABLE_BLOCK" | jq -r '."latest-release-date"')
          IS_SECURITY=$(echo "$LATEST_STABLE_BLOCK" | jq -r '."security"')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "❌ Failed to parse .NET release variables."
            exit 1
          fi

          # Set a clear visual indicator for security patches
          STATUS_ALERT="📢 *New Official .NET Release Available*"
          if [ "$IS_SECURITY" = "true" ]; then
            STATUS_ALERT="⚠️ *CRITICAL SECURITY RELEASE AVAILABLE*"
          fi

          # Construct the clean Slack JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "text": "New .NET Release: $VERSION",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "$STATUS_ALERT\n*Version:* \`$VERSION\`\n*Released On:* $RELEASE_DATE\n*Security Patch:* $IS_SECURITY"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Release Notes"
                    },
                    "url": "https://microsoft.com"
                  }
                ]
              }
            ]
          }
          EOF
          )

          # Push straight to Slack webhook
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
          echo "✅ Successfully pinged Slack for version $VERSION"
