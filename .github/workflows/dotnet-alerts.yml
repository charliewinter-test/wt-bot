name: Monitor .NET Releases

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual testing

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Uses GitHub's built-in token
        run: |
          # Fetch using authentication to prevent rate-limiting errors
          RELEASE_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://github.com")
          
          # Safely parse JSON properties
          TAG_NAME=$(echo "$RELEASE_DATA" | jq -r '.tag_name // empty')
          HTML_URL=$(echo "$RELEASE_DATA" | jq -r '.html_url // empty')

          # Fallback check if GitHub returns an API error message instead of release payload
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "❌ Failed to parse valid JSON from GitHub API. Response was:"
            echo "$RELEASE_DATA" | head -n 5
            exit 1
          fi

          # Construct the clean Slack JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "text": "📢 New .NET Release: $TAG_NAME",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "📢 *New .NET Release Available*\n*Version:* \`$TAG_NAME\`"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Release Notes"
                    },
                    "url": "$HTML_URL"
                  }
                ]
              }
            ]
          }
          EOF
          )

          # Push straight to Slack webhook
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
          echo "✅ Successfully pushed release $TAG_NAME to Slack."
