name: Monitor .NET Releases

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Microsoft CDN and Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          METADATA=$(curl -s "https://microsoft.com")
          STABLE_BLOCK=$(echo "$METADATA" | jq -c '."releases-index"[] | select(."support-phase" != "preview")' | head -n 1)
          VERSION=$(echo "$STABLE_BLOCK" | jq -r '."latest-release"')
          RELEASE_DATE=$(echo "$STABLE_BLOCK" | jq -r '."latest-release-date"')
          IS_SECURITY=$(echo "$STABLE_BLOCK" | jq -r '."security"')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "❌ Failed to parse .NET release variables."
            exit 1
          fi

          STATUS_ALERT="📢 *New Official .NET Release Available*"
          [ "$IS_SECURITY" = "true" ] && STATUS_ALERT="⚠️ *CRITICAL SECURITY RELEASE AVAILABLE*"

          PAYLOAD=$(cat <<EOF
          {
            "text": "New .NET Release: $VERSION",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "$STATUS_ALERT\n*Version:* \`$VERSION\`\n*Released On:* $RELEASE_DATE\n*Security Patch:* $IS_SECURITY"
                }
              }
            ]
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
