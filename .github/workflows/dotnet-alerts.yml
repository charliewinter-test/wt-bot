name: Monitor .NET Releases

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual testing

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Microsoft CDN and Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Fetch official live .NET release index from Microsoft CDN
          METADATA=$(curl -s "https://microsoft.com")

          # Extract the newest product release version (e.g. 10.0.10)
          LATEST_VERSION=$(echo "$METADATA" | jq -r '."releases-index"[0]."latest-release"')
          RELEASE_DATE=$(echo "$METADATA" | jq -r '."releases-index"[0]."latest-release-date"')

          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "❌ Failed to query Microsoft CDN metadata."
            exit 1
          fi

          # Construct the Slack JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "text": "📢 New .NET Version Available: $LATEST_VERSION",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "📢 *New Official .NET Release Available*\n*Version:* \`$LATEST_VERSION\`\n*Released On:* $RELEASE_DATE"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View .NET Releases"
                    },
                    "url": "https://microsoft.com"
                  }
                ]
              }
            ]
          }
          EOF
          )

          # Send to Slack
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
          echo "✅ Successfully pinged Slack for version $LATEST_VERSION"
